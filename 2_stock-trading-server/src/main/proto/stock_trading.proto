syntax = 'proto3';

package stock_trading;
option java_multiple_files=true;
option java_package="com.gRPC";
option java_outer_classname="StockTradingProto";

service StockTradingService{
  // Unary - RPC - get current stock price
  rpc getStockPrice(StockRequest) returns (StockResponse);
  rpc getAllStockPrice(Empty) returns(StockResponseList);
}

message StockRequest{
  string stock_name = 1;
}
message StockResponse{
  string stock_name = 1;
  double price = 2;
  string timestamp = 3;
}
message StockResponseList{
  // This repeated field creates addAllStock(Iterable<StockResponse> method)
  repeated StockResponse stock = 1;
}
message Empty{}