syntax = 'proto3';

package stock_trading;
option java_multiple_files=true;
option java_package="com.gRPC";
option java_outer_classname="StockTradingProto";

/**
* Service definition for managing stock trading operations.
*/
service StockTradingService{
  /**
   * Processes a continuous stream of stock orders from the client (Client Streaming)
   * and returns a single order summary (OrderSummary) upon stream completion.
   */
  rpc bulkStockOrder(stream StockOrder) returns (OrderSummary);

}

/**
 * Represents each individual stock order message streamed from client to server
 */
message StockOrder{
  string stock_name = 1;
  int32  quantity = 2;
  string order_type = 3; // Sell or Buy
}


/**
 * Aggregated order summary response returned by the server after processing the full stream.
 */
message OrderSummary {
  int32 total_orders = 1;
  double total_price = 2;
  int32 success_count = 3;
}
